version: "3.9"

# Routing: ALL Traefik routes live in this file. Do not add domains in Dokploy's Domains tab —
# Dokploy injects extra Traefik services per domain, which breaks routers without an explicit
# `.service=` ("cannot be linked automatically with multiple Services"). Every router below sets one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gitea-service:
    # Pinned on purpose (not via GITEA_IMAGE env) so a stale env var can't roll back a security upgrade
    image: gitea/gitea:28.3.0
    container_name: gitea
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - USER_UID=${GITEA_USER_UID:-1000}
      - USER_GID=${GITEA_USER_GID:-1000}
      - GITEA__database__DB_TYPE=${GITEA_DB_TYPE:-sqlite3}
      - GITEA__server__ROOT_URL=https://${GITEA_DOMAIN:-gitea.gizmopoker.online}/
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN:-gitea.gizmopoker.online}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__LFS_START_SERVER=${GITEA_LFS_ENABLED:-true}
      - GITEA__service__DISABLE_REGISTRATION=${GITEA_DISABLE_REGISTRATION:-true}
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - ${GITEA_DATA_DIR:-../files/gitea-data}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.gitea-service.loadbalancer.server.port=${GITEA_WEB_PORT:-3000}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.gitea-service-http.rule=Host(`${GITEA_DOMAIN:-gitea.gizmopoker.online}`)"
      - "traefik.http.routers.gitea-service-http.entrypoints=web"
      - "traefik.http.routers.gitea-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.gitea-service-http.service=gitea-service"

      # HTTPS
      - "traefik.http.routers.gitea-service-https.rule=Host(`${GITEA_DOMAIN:-gitea.gizmopoker.online}`)"
      - "traefik.http.routers.gitea-service-https.entrypoints=websecure"
      - "traefik.http.routers.gitea-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.gitea-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gitea-service-https.service=gitea-service"

  ktor-service:
    image: ${POKER_IMAGE:-ghcr.io/amitgoelny/gizmopokertracker:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - DATABASE_URL=${DATABASE_URL:-jdbc:sqlite:/app/data/gizmopoker.db}
      - SECRET_JWT=${SECRET_JWT}
    volumes:
      - ${POKER_DATA_DIR:-../files/poker-data}:/app/data
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.ktor-service.loadbalancer.server.port=${POKER_PORT:-8080}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.ktor-service-http.rule=Host(`${POKER_DOMAIN:-gizmopoker.online}`) || Host(`www.${POKER_DOMAIN:-gizmopoker.online}`)"
      - "traefik.http.routers.ktor-service-http.entrypoints=web"
      - "traefik.http.routers.ktor-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.ktor-service-http.service=ktor-service"

      # HTTPS
      - "traefik.http.routers.ktor-service-https.rule=(Host(`${POKER_DOMAIN:-gizmopoker.online}`) || Host(`www.${POKER_DOMAIN:-gizmopoker.online}`)) && PathPrefix(`/poker-api`)"
      - "traefik.http.routers.ktor-service-https.entrypoints=websecure"
      - "traefik.http.routers.ktor-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.ktor-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ktor-service-https.service=ktor-service"
      - "traefik.http.routers.ktor-service-https.middlewares=poker-strip@docker"
      - "traefik.http.middlewares.poker-strip.stripprefix.prefixes=/poker-api"

  swim-service:
    image: ${SWIM_IMAGE:-ghcr.io/amitgoelny/swimmasterapp-backend:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - PORT=${SWIM_PORT:-8080}
      - JWT_SECRET=${SWIM_JWT_SECRET}
      - JWT_ISSUER=${SWIM_JWT_ISSUER:-http://swim-master-api}
      - JWT_AUDIENCE=${SWIM_JWT_AUDIENCE:-swim-master-users}
      - JWT_REALM=${SWIM_JWT_REALM:-SwimMasterApp}
    volumes:
      - ${SWIM_DATA_DIR:-../files/swim-data}:/app/data
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.swim-service.loadbalancer.server.port=${SWIM_PORT:-8080}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.swim-service-http.rule=Host(`${SWIM_DOMAIN:-swim.gizmopoker.online}`)"
      - "traefik.http.routers.swim-service-http.entrypoints=web"
      - "traefik.http.routers.swim-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.swim-service-http.service=swim-service"

      # HTTPS
      - "traefik.http.routers.swim-service-https.rule=Host(`${SWIM_DOMAIN:-swim.gizmopoker.online}`) && PathPrefix(`/swim-api`)"
      - "traefik.http.routers.swim-service-https.entrypoints=websecure"
      - "traefik.http.routers.swim-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.swim-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.swim-service-https.service=swim-service"
      - "traefik.http.routers.swim-service-https.middlewares=swim-strip@docker"
      - "traefik.http.middlewares.swim-strip.stripprefix.prefixes=/swim-api"

  homerun-service:
    image: ${HOMERUN_IMAGE:-ghcr.io/amitgoelny/homerun-hitter-server:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - DATABASE_URL=${HOMERUN_DATABASE_URL:-jdbc:sqlite:/app/data/homerunhitter.db}
      - JWT_SECRET=${HOMERUN_JWT_SECRET}
      - JWT_ISSUER=${HOMERUN_JWT_ISSUER:-homerun-hitter}
      - JWT_AUDIENCE=${HOMERUN_JWT_AUDIENCE:-homerun-hitter-audience}
      - JWT_REALM=${HOMERUN_JWT_REALM:-Homerun Hitter API}
    volumes:
      - ${HOMERUN_DATA_DIR:-../files/homerun-data}:/app/data
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.homerun-service.loadbalancer.server.port=${HOMERUN_PORT:-8080}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.homerun-service-http.rule=Host(`${HOMERUN_DOMAIN:-homerun.gizmopoker.online}`)"
      - "traefik.http.routers.homerun-service-http.entrypoints=web"
      - "traefik.http.routers.homerun-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.homerun-service-http.service=homerun-service"

      # HTTPS
      - "traefik.http.routers.homerun-service-https.rule=Host(`${HOMERUN_DOMAIN:-homerun.gizmopoker.online}`) && PathPrefix(`/homerun-api`)"
      - "traefik.http.routers.homerun-service-https.entrypoints=websecure"
      - "traefik.http.routers.homerun-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.homerun-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.homerun-service-https.service=homerun-service"
      - "traefik.http.routers.homerun-service-https.middlewares=homerun-strip@docker"
      - "traefik.http.middlewares.homerun-strip.stripprefix.prefixes=/homerun-api"

  guiltfree-service:
    image: ${GUILTFREE_IMAGE:-ghcr.io/amitgoelny/guiltfree-server:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - DATABASE_URL=${GUILTFREE_DATABASE_URL:-jdbc:sqlite:/app/data/guiltfree.db}
      - JWT_SECRET=${GUILTFREE_JWT_SECRET}
      - JWT_ISSUER=${GUILTFREE_JWT_ISSUER:-guiltfree-api}
      - JWT_AUDIENCE=${GUILTFREE_JWT_AUDIENCE:-guiltfree-app}
      - JWT_REALM=${GUILTFREE_JWT_REALM:-Guilt Free API}
      - JWT_ACCESS_TOKEN_EXPIRY_MINUTES=${GUILTFREE_JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRY_DAYS=${GUILTFREE_JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      - KTOR_ENV=${GUILTFREE_KTOR_ENV:-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-nokey}
    volumes:
      - ${GUILTFREE_DATA_DIR:-../files/guiltfree-data}:/app/data
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.guiltfree-service.loadbalancer.server.port=${GUILTFREE_PORT:-8080}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.guiltfree-service-http.rule=Host(`${GUILTFREE_DOMAIN:-guiltfree.gizmopoker.online}`)"
      - "traefik.http.routers.guiltfree-service-http.entrypoints=web"
      - "traefik.http.routers.guiltfree-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.guiltfree-service-http.service=guiltfree-service"

      # HTTPS
      - "traefik.http.routers.guiltfree-service-https.rule=Host(`${GUILTFREE_DOMAIN:-guiltfree.gizmopoker.online}`)"
      - "traefik.http.routers.guiltfree-service-https.entrypoints=websecure"
      - "traefik.http.routers.guiltfree-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.guiltfree-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.guiltfree-service-https.service=guiltfree-service"

  cookbook-service:
    image: ${COOKBOOK_IMAGE:-ghcr.io/amitgoelny/cookbook-server:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-always}
    logging: *default-logging
    networks:
      - dokploy-network
    environment:
      - DATABASE_URL=${COOKBOOK_DATABASE_URL:-jdbc:sqlite:/app/data/cookbook.db}
      - AUTH_TOKEN=${COOKBOOK_AUTH_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOWED_HOST=*
    volumes:
      - ${COOKBOOK_DATA_DIR:-../files/cookbook-data}:/app/data
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.cookbook-service.loadbalancer.server.port=${COOKBOOK_PORT:-8080}"

      # HTTP -> HTTPS redirect (Dokploy's built-in file-provider middleware)
      - "traefik.http.routers.cookbook-service-http.rule=Host(`${COOKBOOK_DOMAIN:-cookbook.gizmopoker.online}`)"
      - "traefik.http.routers.cookbook-service-http.entrypoints=web"
      - "traefik.http.routers.cookbook-service-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.cookbook-service-http.service=cookbook-service"

      # HTTPS
      - "traefik.http.routers.cookbook-service-https.rule=Host(`${COOKBOOK_DOMAIN:-cookbook.gizmopoker.online}`)"
      - "traefik.http.routers.cookbook-service-https.entrypoints=websecure"
      - "traefik.http.routers.cookbook-service-https.tls=${TLS_ENABLE:-true}"
      - "traefik.http.routers.cookbook-service-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cookbook-service-https.service=cookbook-service"

networks:
  dokploy-network:
    external: true